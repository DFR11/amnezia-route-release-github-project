name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v2026.10.14"
        required: true
        type: string
      prerelease:
        description: "Create as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Build JSON and create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build routing JSON
        run: |
          python scripts/build_routes.py \
            --template template/routes.template.json \
            --input-dir input \
            --output dist/amnezia-routes.json

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            dist/amnezia-routes.json \
            --title "${{ steps.release.outputs.tag }}" \
            --generate-notes \
            $([[ "${{ steps.release.outputs.prerelease }}" == "true" ]] && echo "--prerelease")
